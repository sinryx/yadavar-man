<style>
:root{--bg:#eef1f0;--surface:#fff;--ink:#17262b;--mute:#5d7076;--line:#d5dddc;--pri:#1f6f78;--onpri:#fff;--amber:#e0a526;--bad:#b5473a;--ok:#2e7d4f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1d;--surface:#172429;--ink:#e6efee;--mute:#94a8ad;--line:#2a3b40;--pri:#4fb3bd;--onpri:#0c1a1d;--amber:#f0be4a;--bad:#e07a6c;--ok:#5fc08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1d;--surface:#172429;--ink:#e6efee;--mute:#94a8ad;--line:#2a3b40;--pri:#4fb3bd;--onpri:#0c1a1d;--amber:#f0be4a;--bad:#e07a6c;--ok:#5fc08a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;font-size:16px;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.5rem;font-weight:800;margin:8px 0 2px}
h2{font-size:1.1rem;font-weight:600;margin:20px 0 8px}
.sub{color:var(--mute);margin:0 0 12px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mute);font:inherit;font-weight:600;cursor:pointer}
nav button[aria-current="true"]{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.t{font-weight:600}
.m{color:var(--mute);font-size:.88rem}
.tag{font-size:.78rem;padding:1px 8px;border-radius:99px;border:1px solid var(--amber);color:var(--amber)}
button.b{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.p{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
button.b:disabled{opacity:.4;cursor:not-allowed}
button.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{margin:0;font-weight:400;display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:6px 10px}

#ov button{font:inherit;font-weight:700;font-size:1.1rem;padding:14px;border-radius:14px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer}
#ov button.f{background:#fff;color:#17262b;border-color:#fff}
#ov button:disabled{opacity:.35}
#ov .cd{font-size:3rem;font-weight:800;margin-bottom:8px}
:root{--bg:#e8eff0;--pri:#16616b;--line:#cfdadc}
body{background-image:linear-gradient(180deg,color-mix(in srgb,var(--pri) 14%,var(--bg)),var(--bg) 280px);background-repeat:no-repeat}
h1{font-size:2rem;letter-spacing:-.01em;line-height:1.3}
#v-today>h1,#v-today>.sub{display:none}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 22px}
.hero h1{display:block;margin:0}
.hd{color:var(--mute);font-weight:600}
.ring{width:88px;height:88px;flex:none}
.ring circle{fill:none;stroke-width:7}
.rb{stroke:var(--line)}
.rf{stroke:var(--pri);stroke-linecap:round;transform:rotate(-90deg);transform-origin:40px 40px;transition:stroke-dashoffset .6s ease}
.ring text{fill:var(--ink);font:800 17px Vazirmatn,Tahoma,sans-serif}
.card{border-radius:18px;padding:14px 16px}
.card.tl{border-inline-start:5px solid var(--pri)}
.card.tl.dn{border-inline-start-color:var(--ok);opacity:.8}
.tm{font-weight:800;font-size:1.2rem;min-width:3.4rem;color:var(--pri);font-variant-numeric:tabular-nums}
.card .t{font-size:1.05rem}
button.b{border-radius:12px;min-height:44px}
button.p{font-weight:800}
input,select,textarea{border-radius:12px;min-height:46px}
label{font-size:.92rem;color:var(--mute);margin-top:16px}
.days{gap:8px}
.days label{position:relative;border-radius:99px;padding:8px 14px;margin:0;color:var(--ink);cursor:pointer}
.days input{position:absolute;opacity:0;width:1px;min-height:0}
.days label:has(input:checked){background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:600}
.days label:has(input:focus-visible){outline:3px solid var(--amber);outline-offset:2px}
.bar{height:10px}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:36px 12px}
nav{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.8rem;padding:10px 4px}
nav button[aria-current="true"]{box-shadow:none}
nav svg{width:25px;height:25px}
#ov h2{font-size:2.4rem;line-height:1.3}
#ov button{border-radius:18px;min-height:56px}
#ov .cd{font-size:4rem;line-height:1}
main section:not([hidden]){animation:vin .22s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button{transition:transform .12s ease,background-color .2s}
button:active{transform:scale(.96)}
#v-today .card{animation:cin .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes cin{from{opacity:0;transform:translateX(-18px)}}
.rf{animation:ringin .9s ease-out}
@keyframes ringin{from{stroke-dashoffset:213.6}}
.bar i{animation:barin .7s ease-out}
@keyframes barin{from{width:0}}
.card.tl.dn .t::after{content:"";display:inline-block;width:.4em;height:.75em;border:solid var(--ok);border-width:0 3px 3px 0;transform:rotate(45deg);margin-inline-start:.7em;animation:chk .35s ease-out .3s both}
@keyframes chk{from{opacity:0;transform:rotate(45deg) scale(.2)}}
nav button{transition:color .2s}
nav svg{transition:transform .2s ease}
nav button[aria-current="true"] svg{transform:translateY(-2px) scale(1.12)}
#ov.show{animation:ovin .3s ease-out}
@keyframes ovin{from{opacity:0;transform:scale(1.05)}}
#ov h2.al::before{content:"";display:block;width:26px;height:26px;margin:0 auto 28px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}100%{box-shadow:0 0 0 46px transparent}}
.pop{animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(1.4);opacity:.3}}
.tag{white-space:nowrap;display:inline-block;line-height:1.5;vertical-align:middle}
button.sm{min-height:36px;padding:4px 10px;font-size:.82rem;font-weight:600}
nav button{font-size:.72rem;padding:9px 2px}
nav svg{width:23px;height:23px}
.banner{background:color-mix(in srgb,var(--amber) 18%,var(--surface));border:1px solid var(--amber);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px 14px;margin-bottom:14px}
.sec h2{margin:12px 0 4px;font-size:1.05rem}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:0}
.sr .grow{min-width:0}
.sr select,.sr input[type=number]{width:auto;min-width:120px}
.st{font-size:.85rem;padding:8px 12px;border-radius:12px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.st.okb{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.st.badb{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.st.inf{background:var(--bg);color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:150px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-start;background:var(--pri);color:var(--onpri);border-end-start-radius:6px}
.msg.bot{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-end-end-radius:6px}
.msg.err{border-color:var(--bad);color:var(--bad)}
.chip{display:inline-block;font-size:.8rem;margin-top:6px;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.sugg{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sugg button{text-align:start}
#composer{position:fixed;inset-inline:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:8px 12px;display:none;gap:8px;align-items:flex-end;border-top:1px solid var(--line);z-index:5}
#composer.show{display:flex}
#composer textarea{flex:1;min-height:46px;max-height:130px;resize:none}
#composer button{min-width:64px}
.dots::after{content:"…";animation:dd 1s steps(3) infinite}
@keyframes dd{0%{content:"."}50%{content:".."}100%{content:"..."}}

#c-mic{min-width:46px;padding:0 10px;display:none}
html.native #c-mic{display:inline-flex;align-items:center;justify-content:center}
#c-mic svg{width:22px;height:22px}
#c-mic.on{background:#c0392b;color:#fff;border-color:#c0392b}
html.quick,html.quick body{background:transparent!important;background-image:none!important}
html.quick body{background:rgba(0,0,0,.42)!important;min-height:100vh;overflow:hidden}
html.quick nav,html.quick main{display:none!important}
#qsheet{position:fixed;inset-inline:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:78vh;display:flex;flex-direction:column;background:var(--bg);border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.35);overflow:hidden;animation:qin .2s ease-out}
@keyframes qin{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#qsheet #v-ai{flex:1;overflow-y:auto;padding:12px 14px 6px;min-height:120px}
#qsheet #composer{position:static;border-top:1px solid var(--line);background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
#qsheet h1{font-size:19px;margin:0}
.qh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
</style>
</head>
<body>
<main>
  <section id="v-today"></section>
  <section id="v-new" hidden></section>
  <section id="v-ai" hidden></section>
  <section id="v-rep" hidden></section>
  <section id="v-set" hidden></section>
</main>
<nav>
  <button data-v="today" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>امروز</button>
  <button data-v="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>تسک جدید</button>
  <button data-v="ai" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>دستیار</button>
  <button data-v="rep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>گزارش</button>
  <button data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>تنظیمات</button>
</nav>
<div id="composer"><button class="b" id="c-mic" aria-label="گفتن با صدا"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><textarea id="c-in" rows="1" placeholder="مثلاً: ۵ دقیقه دیگه یادم بنداز گوشیمو بردارم"></textarea><button class="b p" id="c-send">ارسال</button></div>
<div id="ov" role="alertdialog" aria-live="assertive"></div>

<script>
var NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
var Alarm=NATIVE?Capacitor.registerPlugin('Alarm'):null;
var DAYS=[['ش',6],['ی',0],['د',1],['س',2],['چ',3],['پ',4],['ج',5]];
var DAYN={0:'یکشنبه',1:'دوشنبه',2:'سه‌شنبه',3:'چهارشنبه',4:'پنجشنبه',5:'جمعه',6:'شنبه'};
var S={tasks:[],log:{}};
var open=null,cdTimer=null;
try{var raw=localStorage.getItem('reminder-app');if(raw)S=JSON.parse(raw)}catch(e){}
var QUICK=/^#quick/.test(location.hash),QMIC=/mic/.test(location.hash);if(QUICK)document.documentElement.classList.add('quick');if(NATIVE)document.documentElement.classList.add('native');
if(!S.snooze)S.snooze={};var snooze=S.snooze;
if(!S.cats)S.cats=['شخصی','سلامت','درس و کار','خانه','وسایل'];
function catOpts(){return S.cats.map(function(c){return '<option>'+esc(c)+'</option>'}).join('')}
function getCat(el){var v=el.querySelector('#f-cat').value;if(v==='__new'){v=(el.querySelector('#f-newcat').value||'').trim()||'شخصی';if(S.cats.indexOf(v)<0)S.cats.push(v)}return v}
function whyHtml(W){var k=Object.keys(W);if(!k.length)return '';return '<div class="m">دلیل‌ها: '+k.map(function(x){return esc(x)+' '+fa(W[x])}).join('، ')+'</div>'}
function save(){try{localStorage.setItem('reminder-app',JSON.stringify(S))}catch(e){}}
function reloadS(){try{var raw=localStorage.getItem('reminder-app');if(!raw)return;var n=JSON.parse(raw);Object.keys(S).forEach(function(k){if(!(k in n))delete S[k]});Object.assign(S,n);if(!S.snooze)S.snooze={};snooze=S.snooze}catch(e){}}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fa(n){return Number(n).toLocaleString('fa-IR',{useGrouping:false})}
function ftime(t){return t.split(':').map(function(x){return fa(x.padStart?x:x)}).join(':')}
function hero(L,dn){var pc=L.length?dn/L.length:0,C=213.6,n=new Date();return '<header class="hero"><div><div class="hd">'+n.toLocaleDateString('fa-IR',{weekday:'long'})+'</div><h1>'+n.toLocaleDateString('fa-IR',{day:'numeric',month:'long'})+'</h1><p class="sub">'+(L.length?fa(dn)+' از '+fa(L.length)+' یادآوری پاسخ داده شد':'امروز یادآوری‌ای نداری')+'</p></div><svg class="ring" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" class="rb"/><circle cx="40" cy="40" r="34" class="rf" style="stroke-dasharray:'+C+';stroke-dashoffset:'+(C*(1-pc))+'"/><text x="40" y="46" text-anchor="middle">'+fa(Math.round(pc*100))+'٪</text></svg></header>'}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function activeOn(t,d){
  if(!t.active)return false;
  var s=parse(t.start),e=t.days?new Date(s.getFullYear(),s.getMonth(),s.getDate()+t.days-1):null;
  if(d<s||(e&&d>e))return false;
  if(t.repeat==='daily')return true;
  if(t.repeat==='once')return ds(d)===t.start;
  if(t.repeat==='every')return Math.round((d-s)/864e5)%(t.every||2)===0;
  if(t.repeat==='weekly')return t.wdays.indexOf(d.getDay())>-1;
  if(t.repeat==='monthly')return d.getDate()===t.mday;
  return false;
}
function key(t,d){return t.id+'|'+ds(d)}
function todayList(){
  var now=new Date(),d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return S.tasks.filter(function(t){return activeOn(t,d)}).sort(function(a,b){return a.time<b.time?-1:1}).map(function(t){return{t:t,k:key(t,d),l:S.log[key(t,d)]}});
}
function dueNow(t){var n=new Date(),p=t.time.split(':'),m=(+p[0])*60+(+p[1]),c=n.getHours()*60+n.getMinutes();return c-m}

/* ---------- views ---------- */
function show(v){
  ['today','new','ai','rep','set'].forEach(function(x){document.getElementById('v-'+x).hidden=x!==v});document.getElementById('composer').classList.remove('show');window.scrollTo(0,0);
  document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-current',b.dataset.v===v)});
  if(v==='today')rToday();if(v==='rep')rRep();if(v==='new')rNew();if(v==='ai')rAI();if(v==='set'){rSet();loadNative().then(function(){if(!document.getElementById('v-set').hidden)rSet()})}
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){show(b.dataset.v)}});

function rToday(){
  var L=todayList(),h='<h1>امروز</h1><p class="sub">'+DAYN[new Date().getDay()]+'، '+fa(L.length)+' یادآوری</p>';
  var dn=L.filter(function(x){return x.l}).length;

  if(!L.length)h+='<div class="empty">برای امروز یادآوری‌ای نیست.<br>از «تسک جدید» یکی بساز.</div>';

function rRep(){
  var h='<h1>گزارش</h1><p class="sub">از روز شروع هر تسک تا امروز</p>';
  if(!S.tasks.length)h+='<div class="empty">هنوز تسکی نداری.</div>';
  var today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  S.tasks.forEach(function(t){
    var tot=0,done=0,skip=0,miss=0,ok=0,rem=0,uns=0,WH={},d=parse(t.start);
    while(d<=today){
      if(activeOn(t,d)){
        var l=S.log[key(t,d)],isToday=d.getTime()===today.getTime();
        if(l){tot++;if(l.s==='done')done++;else if(l.s==='skipped'){skip++;if(l.why)WH[l.why]=(WH[l.why]||0)+1}else if(l.s==='reviewed'){done++;if(l.a==='all_good')ok++;else if(l.a==='remembered')rem++;else uns++}}
        else if(!isToday||dueNow(t)>60){tot++;miss++}
      }

    }
    var pct=tot?Math.round(done/tot*100):0;
    h+='<div class="card"><div class="row"><div class="grow t">'+esc(t.title)+'</div><button class="b" data-pause="'+t.id+'">'+(t.active?'توقف':'ادامه')+'</button><button class="b" data-del="'+t.id+'">حذف</button></div>'

    h+=whyHtml(WH);
    if(t.type==='reflection'){
      h+='<div class="m">«همه‌چیز دارم» '+fa(ok)+' بار · «یادم اومد» '+fa(rem)+' بار</div>';

var PRESETS={

};
function aiConf(){var a=S.cfg.ai,p=a.p[a.prov]||{},d=PRESETS[a.prov]||PRESETS.custom;return{base:(p.base||d.base||'').trim().replace(/\/+$/,''),key:(p.key||'').trim(),model:(p.model||d.model||'').trim()}}
function httpReq(method,url,headers,body){
  var H=window.capacitorExports&&capacitorExports.CapacitorHttp;
  if(NATIVE&&H){
    return H.request({method:method,url:url,headers:headers,data:body,connectTimeout:30000,readTimeout:90000}).then(function(r){
      var d=r.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){}}return{status:r.status,data:d};
    });
  }
  return fetch(url,{method:method,headers:headers,body:body?JSON.stringify(body):undefined}).then(function(r){return r.text().then(function(t){var d=t;try{d=JSON.parse(t)}catch(e){}return{status:r.status,data:d}})});
}
function apiErr(r){
  var d=r.data,m='';
  if(Array.isArray(d))d=d[0];
  if(d&&d.error)m=d.error.message||d.error.status||JSON.stringify(d.error);
  else if(typeof d==='string')m=d.slice(0,200);
  var hint={400:'درخواست نامعتبر (شاید اسم مدل اشتباه است)',401:'کلید API نامعتبر است',402:'اعتبار حساب تمام شده',403:'دسترسی رد شد (کلید نامعتبر یا محدودیت منطقه‌ای؛ VPN را امتحان کن)',404:'آدرس یا اسم مدل پیدا نشد',429:'سهمیه یا تعداد درخواست‌ها تمام شده',500:'خطای سرور سرویس‌دهنده',503:'سرویس موقتاً در دسترس نیست'}[r.status]||'';
  var e=new Error((hint?hint+' — ':'')+'کد '+r.status+(m?'\n'+m:''));e.status=r.status;return e;
}
function aiChat(messages,opts){
  var c=aiConf();
  if(!c.key)return Promise.reject(new Error('کلید API وارد نشده.'));
  if(!c.base)return Promise.reject(new Error('آدرس API وارد نشده.'));
  if(!c.model)return Promise.reject(new Error('اسم مدل وارد نشده.'));
  var body={model:c.model,messages:messages,temperature:0.2};
  if(opts&&opts.max)body.max_tokens=opts.max;
  return httpReq('POST',c.base+'/chat/completions',{'Content-Type':'application/json','Authorization':'Bearer '+c.key},body).catch(function(e){
    throw new Error('اتصال برقرار نشد. اینترنت یا VPN را بررسی کن.\n'+(e&&e.message||''));
  }).then(function(r){
    if(r.status<200||r.status>=300)throw apiErr(r);
    var d=r.data;
    var ch=d&&d.choices&&d.choices[0];
    if(!ch)throw new Error('پاسخ نامعتبر از سرویس:\n'+String(JSON.stringify(d)).slice(0,200));
    var txt=ch.message&&ch.message.content;
    if(Array.isArray(txt))txt=txt.map(function(p){return p.text||''}).join('');
    return{text:txt||'',model:d.model||c.model};
  });
}
function aiModels(){
  var c=aiConf();
  return httpReq('GET',c.base+'/models',{'Authorization':'Bearer '+c.key},null).then(function(r){
    if(r.status<200||r.status>=300)throw apiErr(r);
    var L=(r.data&&r.data.data)||[];
    return L.map(function(m){return String(m.id||'').replace(/^models\//,'')}).filter(Boolean).sort();
  });
}

function parseAI(txt){

function faToEn(s){return String(s).replace(/[۰-۹]/g,function(c){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(c)}).replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c)})}
function addTaskObj(a){
  var title=String(a.title||'').trim();if(!title)throw new Error('عنوان خالی');

  var rp=['once','daily','weekly','every','monthly'].indexOf(a.repeat)>-1?a.repeat:'once';

  else{
    tm=faToEn(a.time||'');var m=/^(\d{1,2}):(\d{2})/.exec(tm);if(!m)throw new Error('ساعت نامعتبر');tm=pad2(+m[1])+':'+m[2];
    if(a.date&&/^\d{4}-\d{2}-\d{2}$/.test(faToEn(a.date)))st=faToEn(a.date);
    else if(rp==='once'){var p=tm.split(':'),n=new Date();if(+p[0]*60+ +p[1]<=n.getHours()*60+n.getMinutes()){var tmr=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);st=ds(tmr)}}

      if(a.type==='add_task'){var t=addTaskObj(a);out.push('✓ ساخته شد: '+t.title+' — '+(t.repeat==='once'?(t.start===ds(new Date())?'امروز':t.start)+' ساعت '+ftime(t.time):desc(t)))}
      else{
        var t2=taskById(a.id);if(!t2){out.push('✗ تسک پیدا نشد');return}
        if(a.type==='delete_task'){S.tasks=S.tasks.filter(function(q){return q.id!==a.id});out.push('✓ حذف شد: '+t2.title)}
        else if(a.type==='pause_task'){t2.active=false;out.push('✓ متوقف شد: '+t2.title)}
        else if(a.type==='resume_task'){t2.active=true;out.push('✓ فعال شد: '+t2.title)}

function sendAI(text){

  aiChat([{role:'system',content:sysPrompt()}].concat(hist)).then(function(r){
    var p=parseAI(r.text),acts=applyActions(p.actions);
    S.chat.push({r:'assistant',c:p.reply||(acts.length?'انجام شد.':'…'),acts:acts});
  }).catch(function(e){S.chat.push({r:'assistant',c:'خطا: '+e.message,err:true})}).then(function(){

    try{var o=JSON.parse(s);if(!Array.isArray(o.tasks))throw 0;if(!confirm('تسک‌های فعلی با پشتیبان جایگزین شوند؟'))return;S.tasks=o.tasks;S.log=o.log||{};if(o.cats)S.cats=o.cats;save();$('#d-msg').textContent='بازیابی شد.'}catch(e){$('#d-msg').textContent='متن پشتیبان معتبر نیست.'}
  };
}

updateNav();
if(QUICK){
  var qs=document.createElement('div');qs.id='qsheet';qs.appendChild(document.getElementById('v-ai'));qs.appendChild(document.getElementById('composer'));document.body.appendChild(qs);
  document.body.addEventListener('click',function(e){if(e.target===document.body&&Alarm)Alarm.closeQuick({})});
  show('ai');if(QMIC&&aiConf().key)setTimeout(function(){window.voice()},350);
}else{show('today');tick();}

/* ---------- native (Android) ---------- */
(function(){
if(!Alarm)return;
function itemFor(x){var t=x.t;return{at:x.at.getTime(),title:t.title,body:t.note||(t.type==='reflection'?'چیزی جا نذاشتی؟':t.type==='alarm'?'آلارم':'انجامش دادی؟'),k:x.k,taskId:t.id,type:t.type||'normal',snz:t.snz||10,snd:t.snd!==false,vib:t.vib!==false}}
function upcoming(){
  var out=[],now=Date.now(),base=new Date();base=new Date(base.getFullYear(),base.getMonth(),base.getDate());
  Object.keys(S.snooze).forEach(function(k){if(S.snooze[k]<now-864e5)delete S.snooze[k]});
  for(var i=-1;i<31&&out.length<80;i++){
    var d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+i);
    S.tasks.forEach(function(t){
      if(!activeOn(t,d))return;var k=key(t,d);if(S.log[k])return;
      var p=t.time.split(':'),at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+p[0],+p[1]);
      if(S.snooze[k]&&S.snooze[k]>now)at=new Date(S.snooze[k]);
      if(at.getTime()<=now+3000)return;
      out.push({t:t,k:k,at:at});
    });
  }
  out.sort(function(a,b){return a.at-b.at});return out.slice(0,80);
}
var rt=null;
window.resched=function(){clearTimeout(rt);rt=setTimeout(function(){Alarm.scheduleAll({items:upcoming().map(itemFor)}).catch(function(e){console.log('resched',e)})},250)};
var _save=save;save=function(){_save();window.resched()};
var _close=closeAlarm;closeAlarm=function(){_close();Alarm.stop().catch(function(){});window.resched()};
function applyQueue(){
  return Alarm.drainQueue().then(function(r){
    var A=r.actions||[],ch=false;
    A.forEach(function(q){
      if(!q||!q.k||String(q.k).indexOf('test|')===0)return;
      if(q.a==='later'){S.snooze[q.k]=q.until;ch=true;return}
      var t=taskById(q.taskId);if(!t)return;
      S.log[q.k]=t.type==='reflection'?{s:'reviewed',a:'all_good',at:q.ts}:{s:'done',at:q.ts};delete S.snooze[q.k];ch=true;
    });
    if(ch){save();rerender()}
  }).catch(function(){});
}
function checkLaunch(){
  return Alarm.takeLaunch().then(function(r){
    var it=r&&r.item;if(!it)return;
    if(open){clearInterval(cdTimer);document.getElementById('ov').className='';open=null}
    if(it.test){openAlarm({id:'test',title:it.title||'تست آلارم',note:it.body,type:'alarm',snz:10},it.k,true);return}
    var t=taskById(it.taskId);
    if(t&&!S.log[it.k])openAlarm(t,it.k,false);else Alarm.stop();
  }).catch(function(){});
}
function sync(){return applyQueue().then(checkLaunch).then(function(){window.resched()})}
if(QUICK){
  var QA=window.capacitorApp&&window.capacitorApp.App;
  if(QA)QA.addListener('backButton',function(){Alarm.closeQuick({})});
  return;
}
Alarm.addListener('launch',function(){checkLaunch()});
Alarm.addListener('queue',function(){applyQueue().then(function(){window.resched()})});
var AP=window.capacitorApp&&window.capacitorApp.App;
if(AP){
  AP.addListener('appStateChange',function(s){if(s.isActive){if(!open){reloadS();applyTheme();updateNav()}sync().then(function(){if(!open)rerender()});if(!document.getElementById('v-set').hidden)loadNative().then(rSet)}});
  AP.addListener('backButton',function(){
    if(open){if(open.p)closeAlarm();return}
    if(document.getElementById('v-today').hidden)show('today');else AP.minimizeApp();
  });
}
// clean up alarms scheduled by v1.0
try{var LN=window.capacitorLocalNotifications&&window.capacitorLocalNotifications.LocalNotifications;
if(LN&&!localStorage.getItem('lnClean')){LN.getPending().then(function(r){var n=(r&&r.notifications)||[];return n.length?LN.cancel({notifications:n.map(function(x){return{id:x.id}})}):null}).then(function(){localStorage.setItem('lnClean','1')}).catch(function(){})}}catch(e){}
Alarm.perms().then(function(p){PERMS=p;if(!p.notif)Alarm.requestNotif();rerender()}).catch(function(){});
sync();
})();
</script>
</body>
</html>
